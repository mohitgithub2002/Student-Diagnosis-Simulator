# Local stack: Postgres, Redis, API, Celery worker + beat, web app.
#   docker compose up --build
#   docker compose exec api python -m app.cli demo     # optional demo data
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sds
      POSTGRES_PASSWORD: sds
      POSTGRES_DB: sds
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sds"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && python -m app.cli seed && python -m app.cli partitions && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &backend-env
      SDS_DATABASE_URL: postgresql+psycopg://sds:sds@db:5432/sds
      SDS_REDIS_URL: redis://redis:6379/0
      SDS_ENVIRONMENT: dev
      SDS_CELERY_EAGER: "false"
      SDS_PUBLIC_WEB_URL: http://localhost:5173
      SDS_CORS_ORIGINS: '["http://localhost:5173"]'
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --beat --loglevel=info
    environment: *backend-env
    depends_on: [api]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
