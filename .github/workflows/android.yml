name: Android

# Builds the Android app with Gradle (including the Kotlin voice module and its unit tests) and uploads an
# installable APK. Separate from ci.yml because a native build takes far longer than the other checks.
on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/task-library/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/mobile/**", "packages/task-library/**", ".github/workflows/android.yml"]

jobs:
  apk:
    name: android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: "1"
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Voice module unit tests and release APK
        working-directory: apps/mobile/android
        # The release build is signed with the debug key, so it can be installed for testing (not for the store).
        run: ./gradlew :sds-voice:testDebugUnitTest :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sds-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sds-voice-test-report
          path: apps/mobile/modules/sds-voice/android/build/reports/tests/
          if-no-files-found: ignore
