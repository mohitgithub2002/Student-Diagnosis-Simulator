[project]
name = "sds-backend"
version = "0.1.0"
description = "Student Diagnostic Simulator API, scoring engine and report service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "cryptography>=42",
    "celery[redis]>=5.4",
    "jinja2>=3.1",
    "weasyprint>=62",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Authored bilingual content and report wording: long natural-language strings.
"app/content/authored/*" = ["E501"]
"app/content/tasks.py" = ["E501"]
"app/reports/wording.py" = ["E501"]
"app/services/consent.py" = ["E501"]
"app/services/messaging.py" = ["E501"]
